<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎯 JavaScript Event Playground</h1>

  <!-- Button -->
  <button id="changeBtn">Click Me</button>

  <!-- Image Slideshow -->
  <h2>Image Slideshow</h2>
  <div class="gallery">
    <img id="slideImage" src="https://via.placeholder.com/300x200/ff7f7f" alt="Slideshow" width="300">
  </div>
  
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn" data-tab="1">Tab 1</button>
    <button class="tab-btn" data-tab="2">Tab 2</button>
    <div id="tab-1" class="tab-content">Content for Tab 1</div>
    <div id="tab-2" class="tab-content hidden">Content for Tab 2</div>
  </div>

  <!-- Form -->
  <form id="myForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Submit</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
